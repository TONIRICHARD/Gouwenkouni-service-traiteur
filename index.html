/* ---------- RAPPORTS & STATISTIQUES ---------- */
function renderRapportsSub(){
  const salesInRange = state.sales.filter(s=>inRange(s.dateISO));
  const revenue = salesInRange.reduce((a,s)=>a+s.total,0);
  const cogs = salesInRange.reduce((a,s)=> a + s.items.reduce((x,it)=>x+it.qty*(it.coutUnitaireMoyen||0),0), 0);
  const profit = revenue - cogs;

  // Top produits
  const perProduct = {};
  salesInRange.forEach(s=> s.items.forEach(it=>{
    if(!perProduct[it.productId]) perProduct[it.productId] = {name:it.name, qty:0, revenu:0};
    perProduct[it.productId].qty += it.qty;
    perProduct[it.productId].revenu += it.total;
  }));
  const topProducts = Object.values(perProduct).sort((a,b)=>b.revenu-a.revenu).slice(0,5);

  // Répartition par mode de paiement
  const parMode = {};
  salesInRange.forEach(s=>{ parMode[s.paymentMode] = (parMode[s.paymentMode]||0) + s.total; });
  const maxMode = Math.max(1, ...Object.values(parMode));

  // Répartition des dépenses par catégorie
  const expensesInRangeR = state.expenses.filter(e=>inRange(e.dateISO));
  const parCategorieDepense = {};
  expensesInRangeR.forEach(e=>{ const c = e.categorie||'Autres'; parCategorieDepense[c] = (parCategorieDepense[c]||0) + e.amount; });
  const maxCatDep = Math.max(1, ...Object.values(parCategorieDepense));

  // Tendance des 7 derniers jours
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date();
    d.setDate(d.getDate()-i);
    const key = d.toISOString().slice(0,10);
    const total = state.sales.filter(s=>isSameDay(s.dateISO,key)).reduce((a,s)=>a+s.total,0);
    days.push({label: d.toLocaleDateString('fr-FR',{weekday:'short'}), total});
  }
  const maxDay = Math.max(1, ...days.map(d=>d.total));

  document.getElementById('suivi-body').innerHTML = `
    <div class="chipbar" style="margin-top:14px;">${rangeBtns()}</div>
    <div class="summary3">
      <div class="box"><b>${fmt(revenue)}</b><small>Recette période</small></div>
      <div class="box"><b class="${profit>=0?'gain':'perte'}">${fmt(profit)}</b><small>Bénéfice net</small></div>
      <div class="box"><b>${salesInRange.length}</b><small>Ventes</small></div>
    </div>

    <div class="section-label">Tendance des 7 derniers jours</div>
    <div class="row-card" style="cursor:default;display:block;">
      <div class="trendbars">
        ${days.map(d=>`<div class="tb" style="height:${Math.max(4,(d.total/maxDay*100))}%;"><small>${escapeHtml(d.label)}</small></div>`).join('')}
      </div>
    </div>

    <div class="section-label" style="margin-top:26px;">Meilleures ventes (période sélectionnée)</div>
    ${topProducts.length===0 ? '<div class="empty-note">Pas encore de vente sur cette période.</div>' :
      topProducts.map((p,i)=>`
        <div class="rank-row">
          <span class="num">${i+1}</span>
          <span class="n2">${escapeHtml(p.name)}</span>
          <div class="v"><b>${fmt(p.revenu)}</b><small>${p.qty} vendu(s)</small></div>
        </div>
      `).join('')}

    <div class="section-label">Répartition des dépenses par catégorie</div>
    ${Object.keys(parCategorieDepense).length===0 ? '<div class="empty-note">Aucune dépense sur cette période.</div>' :

        <div class="paybar-row">

  `;
  document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click', ()=>{ historyRange=b.dataset.range; renderRapportsSub(); }));

  document.getElementById('export-csv').addEventListener('click', ()=>{
    const rows = [['Type','Date','Description','Catégorie / Paiement','Montant']];
    salesInRange.forEach(s=>{
      rows.push(['Vente', new Date(s.dateISO).toLocaleString('fr-FR'), s.items.map(it=>it.name+' x'+it.qty).join(' + '), s.paymentMode, s.total]);
    });
    expensesInRangeR.forEach(e=>{
      rows.push(['Dépense', new Date(e.dateISO).toLocaleDateString('fr-FR'), e.label, e.categorie||'Autres', -e.amount]);
    });
    const csv = rows.map(r=>r.map(v=>{
      const s = String(v).replace(/"/g,'""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    }).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `rapport-${state.config.shopName.replace(/\s+/g,'_')}-${todayStr()}.csv`;

function openChangeCloudPasswordModal(){
  const html = `
    <div class="modal-title">Mot de passe du compte en ligne</div>
    <div class="modal-sub">Ce mot de passe protège la sauvegarde en ligne de toutes vos données. Il doit contenir au moins une lettre et un chiffre.</div>
    <div class="field"><label>Mot de passe actuel</label><input id="cloud-pwd-current" type="password" placeholder="Mot de passe actuel"></div>
    <div class="field"><label>Nouveau mot de passe</label><input id="cloud-pwd-new" type="password" placeholder="Au moins 6 caractères, lettres et chiffres"></div>
    <div class="field"><label>Confirmer le nouveau mot de passe</label><input id="cloud-pwd-confirm" type="password" placeholder="Retapez le nouveau mot de passe"></div>
    <button class="btn btn-primary" id="confirm-cloud-pwd">Modifier</button>
  `;
  openModal(html, ()=>{
    document.getElementById('confirm-cloud-pwd').addEventListener('click', async ()=>{
      const current = document.getElementById('cloud-pwd-current').value;
      const next = document.getElementById('cloud-pwd-new').value;
      const confirmVal = document.getElementById('cloud-pwd-confirm').value;
      if(!window.gouwenkouniCloud){ toast('Firebase non chargé'); return; }
      if(next.length<6 || !/[a-zA-Z]/.test(next) || !/[0-9]/.test(next)){
        toast('Le nouveau mot de passe doit avoir au moins 6 caractères, avec lettres et chiffres'); return;
      }
      if(next !== confirmVal){ toast('Les mots de passe ne correspondent pas'); return; }
      try{
        await window.gouwenkouniCloud.cloudChangePassword(current, next);
        closeModal();
        toast('Mot de passe modifié avec succès');
        logActivity('Mot de passe en ligne modifié', '');
      }catch(e){
        console.error(e);
        toast('Échec : vérifiez le mot de passe actuel et votre connexion internet');
      }
    });
  });
}

    else{ toast('Réservé au/à la propriétaire'); }
  });
}

/* =========================================================
   INIT
========================================================= */
function waitForCloud(timeoutMs){
  return new Promise(resolve=>{
    if(window.gouwenkouniCloud){ resolve(); return; }
    const onReady = ()=>{ window.removeEventListener('gouwenkouni-cloud-ready', onReady); resolve(); };
    window.addEventListener('gouwenkouni-cloud-ready', onReady);
    setTimeout(()=>{ window.removeEventListener('gouwenkouni-cloud-ready', onReady); resolve(); }, timeoutMs||4000);
  });
}

(async function init(){
  await waitForCloud(4000);
  if(window.gouwenkouniCloud){
    try{ await window.gouwenkouniCloud.ensureSignedIn(); }catch(e){ console.error('Connexion Firebase impossible (mode hors ligne)', e); }
  }
  await loadState();
  if(state.config.pin){ showPinScreen(); }
  else{ showApp(); }
})();
</script>

import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  updatePassword, EmailAuthProvider, reauthenticateWithCredential
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

// Configuration Firebase du projet Gouwenkouni
const firebaseConfig = {
  apiKey: "AIzaSyC8qD7pwaDY6tT8lxFBquky0sZvVkKo3_0",
  authDomain: "gouwenkouni-2d764.firebaseapp.com",
  projectId: "gouwenkouni-2d764",
  storageBucket: "gouwenkouni-2d764.firebasestorage.app",
  messagingSenderId: "42444898548",
  appId: "1:42444898548:web:eec3fe99547831b259dea1"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

// Compte technique unique pour la boutique (elle ne voit jamais cet email, seulement le mot de passe)
const CLOUD_EMAIL = 'gouwenkouni@gouwenkouni-app.local';
const DEFAULT_CLOUD_PASSWORD = 'Gouwenkouni2026';
const PWD_KEY = 'gk-cloud-pwd';

function getStoredPassword(){
  try{ return localStorage.getItem(PWD_KEY) || DEFAULT_CLOUD_PASSWORD; }catch(e){ return DEFAULT_CLOUD_PASSWORD; }
}
function setStoredPassword(pwd){
  try{ localStorage.setItem(PWD_KEY, pwd); }catch(e){}
}

// Se connecte au compte technique ; le crée automatiquement au tout premier lancement en ligne.
async function ensureSignedIn(){
  const pwd = getStoredPassword();
  try{
    await signInWithEmailAndPassword(auth, CLOUD_EMAIL, pwd);
    return true;
  }catch(err){
    if(err && (err.code==='auth/user-not-found' || err.code==='auth/invalid-credential' || err.code==='auth/invalid-login-credentials')){
      try{
        await createUserWithEmailAndPassword(auth, CLOUD_EMAIL, pwd);
        return true;
      }catch(err2){ console.error('Firebase : création de compte impossible', err2); return false; }
    }
    console.error('Firebase : connexion impossible', err);
    return false;
  }
}
function isSignedIn(){ return !!auth.currentUser; }

async function cloudLoad(){
  if(!auth.currentUser) return null;
  try{
    const ref = doc(db, 'boutiques', auth.currentUser.uid);
    const snap = await getDoc(ref);
    return snap.exists() ? (snap.data().json || null) : null;
  }catch(e){ console.error('Firebase : lecture impossible', e); return null; }
}
async function cloudSave(jsonString){
  if(!auth.currentUser) return false;
  try{
    const ref = doc(db, 'boutiques', auth.currentUser.uid);
    await setDoc(ref, {json: jsonString, updatedAt: new Date().toISOString()});
    return true;
  }catch(e){ console.error('Firebase : sauvegarde impossible', e); return false; }
}
async function cloudChangePassword(currentPassword, newPassword){
  if(!auth.currentUser) throw new Error('Non connecté');
  const cred = EmailAuthProvider.credential(CLOUD_EMAIL, currentPassword);
  await reauthenticateWithCredential(auth.currentUser, cred);
  await updatePassword(auth.currentUser, newPassword);
  setStoredPassword(newPassword);
}

window.gouwenkouniCloud = {
  ensureSignedIn, isSignedIn, cloudLoad, cloudSave, cloudChangePassword, getStoredPassword
};
window.dispatchEvent(new Event('gouwenkouni-cloud-ready'));
</script>
