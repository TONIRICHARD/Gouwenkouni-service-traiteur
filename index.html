/* ---------- PIN SCREEN ---------- */
#pin-screen{
  position:fixed;inset:0;background:var(--teal-dark);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  z-index:500;color:#fff;padding:24px;
}
#pin-screen .sign{
  font-family:"Fraunces",serif;font-weight:600;font-size:30px;letter-spacing:.3px;
  margin-bottom:6px;text-align:center;
}
#pin-screen .sub{color:#BFE0D6;font-size:13px;margin-bottom:28px;letter-spacing:.04em;text-transform:uppercase;}
#pin-dots{display:flex;gap:14px;margin-bottom:26px;}
#pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid #BFE0D6;}
#pin-dots span.filled{background:var(--gold);border-color:var(--gold);}
#pin-pad{display:grid;grid-template-columns:repeat(3,64px);gap:14px;}
#pin-pad button{
  width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);color:#fff;font-size:20px;font-weight:600;
}
#pin-pad button:active{background:rgba(255,255,255,.2);}
#pin-error{color:var(--coral);font-size:13px;margin-top:14px;height:16px;}

#session-user-screen{
  position:fixed;inset:0;background:var(--paper);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  z-index:480;color:var(--ink);padding:24px;
}
#session-user-screen .sign{
  font-family:"Fraunces",serif;font-weight:600;font-size:28px;letter-spacing:.3px;
  margin-bottom:6px;text-align:center;color:var(--teal-dark);
}
#session-user-screen .sub{color:var(--ink-soft);font-size:13px;margin-bottom:30px;letter-spacing:.02em;text-align:center;}
#session-user-list{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;}
.session-user-btn{
  display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:var(--radius-lg);
  border:1.5px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:16px;font-weight:700;color:var(--ink);
}
.session-user-btn:active{background:var(--teal-tint);border-color:var(--teal);}
.session-user-btn .avatar{
  width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-size:17px;flex-shrink:0;
}
.session-user-btn .star{color:var(--gold);}

/* ---------- APP SHELL ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:84px;position:relative;}
header.topbar{
  padding:22px 18px 16px;
  background:linear-gradient(180deg,var(--teal) 0%, var(--teal-dark) 100%);
  color:#fff;border-radius:0 0 26px 26px;
}
header.topbar .shopname{
  font-family:"Fraunces",serif;font-size:26px;font-weight:600;line-height:1.1;
}
header.topbar .tagline{
  color:#BFE0D6;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px;
}
.user-badge{
  position:absolute;top:20px;right:18px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);
  color:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;
}
header.topbar{position:relative;}
.user-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);}
.user-row:last-child{border-bottom:none;}
.user-row .n{font-weight:600;font-size:14px;}
.user-row button.pick{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:7px 14px;font-size:12.5px;font-weight:700;}
.user-row button.pick.active{background:var(--gold);color:var(--teal-dark);}
.log-row{padding:10px 0;border-bottom:1px solid var(--line);}
.log-row .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;}
.log-row small{color:var(--ink-soft);font-size:11px;}
.trendbars{display:flex;align-items:flex-end;gap:6px;height:110px;margin:10px 0 4px;}
.trendbars .tb{flex:1;background:var(--teal);border-radius:4px 4px 0 0;min-height:3px;position:relative;}
.trendbars .tb small{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9px;color:var(--ink-faint);}
.paybar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.paybar-row .name{width:110px;font-size:12.5px;font-weight:600;}
.paybar-row .track{flex:1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;}
.paybar-row .fill{height:100%;background:var(--teal);}
.paybar-row .val{width:70px;text-align:right;font-size:12px;color:var(--ink-soft);}
.rank-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius-md);padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);}
.rank-row .num{width:24px;height:24px;border-radius:50%;background:var(--teal-tint);color:var(--teal-dark);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rank-row .n2{flex:1;font-weight:600;font-size:13.5px;}
.rank-row .v{text-align:right;}
.rank-row .v b{font-family:"Fraunces",serif;font-size:14.5px;}
.rank-row .v small{font-size:10px;color:var(--ink-faint);display:block;}
.view-title{
  font-family:"Fraunces",serif;font-size:22px;font-weight:600;color:var(--ink);
}
.section-pad{padding:18px;}

/* ---------- BOTTOM NAV (mobile) / SIDEBAR (desktop) ---------- */
nav.bottomnav{
  position:fixed;bottom:0;left:0;right:0;
  max-width:560px;margin:0 auto;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:8px 4px 10px;
  box-shadow:0 -4px 16px rgba(36,31,26,.06);
  z-index:100;
}
.sidebar-brand{display:none;}
nav.bottomnav button{
  background:none;border:none;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--ink-faint);font-size:10.5px;font-weight:600;padding:4px 6px;
  letter-spacing:.01em;
}
nav.bottomnav button .ic{font-size:20px;line-height:1;}
nav.bottomnav button.active{color:var(--teal);}

@media (min-width:900px){
  body{display:flex;background:var(--paper);}
  nav.bottomnav{
    position:fixed;top:0;left:0;bottom:0;right:auto;width:var(--sidebar-w);
    flex-direction:column;justify-content:flex-start;align-items:stretch;
    border-top:none;border-right:1px solid var(--line);padding:26px 14px;gap:4px;
    box-shadow:none;
  }
  .sidebar-brand{
    font-family:"Fraunces",serif;font-weight:600;font-size:19px;color:var(--teal-dark);
    padding:0 12px 20px;display:block;
  }
  nav.bottomnav button{
    flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;
    border-radius:12px;font-size:14px;
  }
  nav.bottomnav button.active{background:var(--teal-tint);}
  nav.bottomnav button .ic{font-size:18px;}

  #app{
    margin-left:var(--sidebar-w);
    max-width:none;
    width:calc(100% - var(--sidebar-w));
    padding-bottom:40px;
  }
  header.topbar, footer.foot-credit{
    max-width:840px;margin-left:auto;margin-right:auto;
  }
  .section-pad{max-width:840px;margin-left:auto;margin-right:auto;}
  .hero-card{max-width:804px;margin-left:auto;margin-right:auto;}

  .floatcart{
    left:var(--sidebar-w);right:0;margin:0 auto;max-width:780px;
  }
  .fab{right:32px;}
  .pgrid{grid-template-columns:repeat(3,1fr);}
  .modal-backdrop{align-items:center;}
  .modal-sheet{border-radius:22px;max-height:88vh;}
  .summary3{max-width:none;}

  /* Réglages : colonne de largeur confortable, centrée */
  #view-settings .section-pad{max-width:620px;margin-left:auto;margin-right:auto;}
}
@media (min-width:1200px){
  .pgrid{grid-template-columns:repeat(4,1fr);}
}

/* ---------- DASHBOARD ---------- */
.hero-card{
  margin:-34px 18px 0; background:var(--card); border-radius:var(--radius-lg);
  box-shadow:var(--shadow-lift); padding:20px; position:relative;
}
.hero-card .label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.hero-card .amount{font-family:"Fraunces",serif;font-size:36px;font-weight:600;margin-top:4px;}
.hero-card .amount span{font-size:18px;color:var(--ink-soft);font-weight:500;}
.hero-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.hero-stats .stat{flex:1;min-width:90px;background:var(--teal-tint);border-radius:var(--radius-md);padding:10px 12px;}
.hero-stats .stat b{display:block;font-size:18px;color:var(--teal-dark);}
.hero-stats .stat small{color:var(--ink-soft);font-size:11px;}

.section-label{
  font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;
  letter-spacing:.08em;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;
}
.section-label a{color:var(--teal);font-weight:700;font-size:12px;cursor:pointer;text-transform:none;letter-spacing:0;}

.alert-row{
  display:flex;align-items:center;gap:10px;background:var(--coral-tint);
  border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;
}
.alert-row .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);flex-shrink:0;}
.alert-row .name{font-weight:600;font-size:13.5px;flex:1;}
.alert-row .qty{font-size:12px;color:var(--coral);font-weight:700;}
.empty-note{color:var(--ink-faint);font-size:13px;padding:6px 2px;}

.receivable-row{
  display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius-md);
  padding:13px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;
}
.receivable-row .ic2{font-size:22px;}
.receivable-row .t{flex:1;}
.receivable-row .t b{display:block;font-size:14px;}
.receivable-row .t small{font-size:11.5px;color:var(--ink-soft);}
.receivable-row .amt{font-family:"Fraunces",serif;font-weight:600;font-size:17px;color:var(--gold);}

.catbar{display:flex;flex-direction:column;gap:8px;}
.catbar .row{display:flex;align-items:center;gap:10px;}
.catbar .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.catbar .name{font-size:13px;flex:1;font-weight:500;}
.catbar .bartrack{flex:2;height:7px;border-radius:4px;background:var(--line);overflow:hidden;}
.catbar .barfill{height:100%;border-radius:4px;}
.catbar .val{font-size:12px;color:var(--ink-soft);width:56px;text-align:right;}

/* ---------- CHIPS ---------- */
.chipbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;-ms-overflow-style:none;scrollbar-width:none;}
.chipbar::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);
  background:var(--card);font-size:13px;font-weight:600;color:var(--ink-soft);white-space:nowrap;
}
.chip.active{color:#fff;border-color:transparent;}

.subtabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.subtabs button{flex:1;min-width:100px;padding:10px 0;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;color:var(--ink-soft);}
.subtabs button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- PRODUCT GRID ---------- */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pcard{
  background:var(--card);border-radius:var(--radius-md);padding:12px;position:relative;
  box-shadow:var(--shadow);border-top:3px solid var(--line);
}
.pcard .tag{
  position:absolute;top:-1px;right:10px;padding:2px 8px 3px;border-radius:0 0 6px 6px;
  font-size:9.5px;font-weight:700;color:#fff;letter-spacing:.02em;
}
.pcard .pname{font-weight:700;font-size:13.5px;margin-top:6px;line-height:1.25;min-height:34px;}
.pcard .pprice{font-family:"Fraunces",serif;font-weight:600;font-size:17px;margin-top:6px;color:var(--teal-dark);}
.pcard .pstock{font-size:11px;color:var(--ink-faint);margin-top:2px;}
.pcard .pstock.low{color:var(--coral);font-weight:700;}
.pcard button.addbtn{
  width:100%;margin-top:8px;background:var(--teal);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:8px 0;font-weight:700;font-size:13px;
}
.pcard button.addbtn:active{background:var(--teal-dark);}
.pos-actions{display:flex;gap:6px;margin-top:8px;}
.pos-actions .quickbtn{
  flex:1;background:var(--gold);color:var(--teal-dark);border:none;border-radius:var(--radius-sm);
  padding:8px 4px;font-weight:800;font-size:12px;
}
.pos-actions .quickbtn:active{background:#C79424;}
.pos-actions .cartbtn{
  width:38px;flex-shrink:0;background:var(--teal-tint);color:var(--teal-dark);border:none;border-radius:var(--radius-sm);
  font-size:15px;
}
.pos-actions .cartbtn:active{background:var(--teal);color:#fff;}
.pcard .editbtn{
  position:absolute;bottom:10px;right:10px;background:none;border:none;color:var(--ink-faint);font-size:15px;
}

/* ---------- FORMS / MODALS ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em;}
.field .hint{font-size:11px;color:var(--ink-faint);margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400;}
.logo-row{display:flex;align-items:center;gap:14px;margin-top:6px;}
.logo-preview{
  width:64px;height:64px;border-radius:16px;object-fit:cover;border:1.5px solid var(--line);
  background:var(--paper);flex-shrink:0;
}
.logo-empty{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink-faint);text-align:center;padding:4px;}
.logo-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.hdr-logo{width:44px;height:44px;border-radius:12px;object-fit:cover;margin-bottom:8px;border:1.5px solid rgba(255,255,255,.4);}
.receipt-logo{width:56px;height:56px;object-fit:cover;border-radius:10px;margin:0 auto 8px;display:block;}
.field input, .field select, .field textarea{
  width:100%;padding:12px 13px;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--paper);font-size:15px;color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}

.btn{
  display:block;width:100%;padding:14px 0;border-radius:var(--radius-md);border:none;
  font-weight:700;font-size:15px;text-align:center;
}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:active{background:var(--teal-dark);}
.btn-ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
.btn-danger{background:var(--coral-tint);color:var(--coral);}
.btn-gold{background:var(--gold);color:var(--teal-dark);}
.btn-sm{width:auto;padding:9px 16px;font-size:13px;display:inline-block;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(36,31,26,.5);z-index:600;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--paper);width:100%;max-width:560px;border-radius:24px 24px 0 0;
  max-height:92vh;overflow-y:auto;padding:18px 18px 26px;
  animation:slideup .22s ease-out;position:relative;
}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-handle{width:40px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
.modal-title{font-family:"Fraunces",serif;font-weight:600;font-size:20px;margin-bottom:16px;}
.modal-sub{font-size:12.5px;color:var(--ink-soft);margin:-10px 0 16px;}

/* ---------- CART / POS ---------- */
.floatcart{
  position:fixed;bottom:88px;left:18px;right:18px;max-width:524px;margin:0 auto;
  background:var(--teal-dark);color:#fff;border-radius:var(--radius-lg);
  padding:14px 18px;display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-lift);z-index:90;
}
.floatcart .cinfo b{display:block;font-size:16px;}
.floatcart .cinfo small{color:#BFE0D6;font-size:11px;}
.floatcart button{background:var(--gold);color:var(--teal-dark);border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:13.5px;}

.cartline{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.cartline .tagdot{width:8px;height:34px;border-radius:4px;flex-shrink:0;}
.cartline .cname{font-weight:600;font-size:14px;flex:1;}
.cartline .cprice{font-size:12px;color:var(--ink-soft);}
.stepper{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:20px;border:1.5px solid var(--line);padding:4px 6px;}
.stepper button{width:26px;height:26px;border-radius:50%;border:none;background:var(--teal-tint);color:var(--teal-dark);font-weight:800;font-size:15px;}
.stepper span{min-width:18px;text-align:center;font-weight:700;font-size:13.5px;}
.stepper input.qty-input{width:52px;min-width:0;text-align:center;font-weight:700;font-size:14px;border:none;background:transparent;padding:2px 0;margin:0;color:inherit;font-family:inherit;-moz-appearance:textfield;appearance:textfield;}
.stepper input.qty-input::-webkit-outer-spin-button,.stepper input.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.stepper input.qty-input:focus{outline:2px solid var(--teal);outline-offset:1px;border-radius:8px;background:#fff;}
.pqty{display:flex;align-items:center;gap:6px;margin-top:8px;}
.pqty label{font-size:11px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
.pqty input.pq{flex:1;min-width:0;width:100%;text-align:center;font-weight:700;font-size:14px;border:1.5px solid var(--line);border-radius:10px;padding:6px 4px;background:var(--card);color:inherit;font-family:inherit;-moz-appearance:textfield;appearance:textfield;}
.pqty input.pq::-webkit-outer-spin-button,.pqty input.pq::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.pqty input.pq:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.cartline .ctotal{font-weight:700;font-size:13.5px;width:64px;text-align:right;}
.cartline .rm{background:none;border:none;color:var(--coral);font-size:16px;padding:0 2px;}

.paymode{display:flex;gap:8px;margin-bottom:14px;}
.paymode button{
  flex:1;padding:12px 0;border-radius:var(--radius-sm);border:1.5px solid var(--line);
  background:var(--card);font-weight:700;font-size:13px;color:var(--ink-soft);
}
.paymode button.active{background:var(--teal);color:#fff;border-color:var(--teal);}

.receipt{
  background:#fff;border-radius:var(--radius-md);padding:20px;
  border:1px dashed var(--ink-faint);
}
.receipt .rline{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;font-family:monospace;}
.receipt .rtotal{border-top:1.5px dashed var(--ink-faint);margin-top:8px;padding-top:10px;font-weight:700;font-size:16px;}
.receipt-head{text-align:center;margin-bottom:12px;}
.receipt-head .rf{font-family:"Fraunces",serif;font-weight:600;font-size:18px;}
.receipt-head small{color:var(--ink-soft);font-size:11px;display:block;}

/* ---------- LIST ROWS (sales/expenses/depots/credits/commandes) ---------- */
.row-card{
  background:var(--card);border-radius:var(--radius-md);padding:13px 14px;margin-bottom:9px;
  display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);cursor:pointer;
  gap:10px;
}
.row-card .l{flex:1;min-width:0;}
.row-card .l b{font-size:14px;display:block;}
.row-card .l small{color:var(--ink-soft);font-size:11.5px;}
.row-card .r{text-align:right;flex-shrink:0;}
.row-card .r b{font-family:"Fraunces",serif;font-size:16px;}
.row-card .r small{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;font-weight:700;display:block;}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.badge.encours{background:var(--gold-tint);color:#8A6A10;}
.badge.solde{background:var(--teal-tint);color:var(--teal-dark);}

.summary3{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.summary3 .box{flex:1;min-width:100px;background:var(--card);border-radius:var(--radius-md);padding:12px;box-shadow:var(--shadow);}
.summary3 .box b{display:block;font-family:"Fraunces",serif;font-size:17px;}
.summary3 .box small{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}

.fab{
  position:fixed;bottom:96px;right:20px;width:54px;height:54px;border-radius:50%;
  background:var(--teal);color:#fff;border:none;font-size:26px;box-shadow:var(--shadow-lift);z-index:95;
}
.searchbar{

}
.searchbar input{border:none;background:none;flex:1;font-size:14px;}
.searchbar input:focus{outline:none;}

.setting-group{background:var(--card);border-radius:var(--radius-md);padding:6px 4px;margin-bottom:16px;box-shadow:var(--shadow);}
.setting-item{display:flex;align-items:center;justify-content:space-between;padding:14px 14px;border-bottom:1px solid var(--line);gap:10px;}
.setting-item:last-child{border-bottom:none;}
.setting-item .t{font-weight:600;font-size:14px;}
.setting-item .d{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.toggle{width:44px;height:26px;border-radius:14px;background:var(--line);position:relative;border:none;flex-shrink:0;}
.toggle.on{background:var(--teal);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on::after{transform:translateX(18px);}

.cat-edit-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);}
.cat-edit-row .swatch{width:16px;height:16px;border-radius:5px;flex-shrink:0;}
.cat-edit-row .n{flex:1;font-weight:600;font-size:13.5px;}
.cat-edit-row button{background:none;border:none;color:var(--ink-faint);font-size:15px;}

/* ---------- ligne builder (achats / depots forms) ---------- */
.ligne-card{background:var(--card);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;border:1.5px solid var(--line);position:relative;}
.ligne-card .rm-ligne{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--coral);font-size:16px;}
.add-ligne-btn{width:100%;padding:12px;border-radius:var(--radius-md);border:1.5px dashed var(--ink-faint);background:none;color:var(--ink-soft);font-weight:700;font-size:13.5px;margin-bottom:14px;}
.ligne-total{text-align:right;font-size:12.5px;color:var(--ink-soft);margin-top:-6px;margin-bottom:14px;}

#toast-root{
  position:fixed;bottom:100px;left:0;right:0;max-width:560px;margin:0 auto;

}
.toast{
  position:relative;background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:30px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lift);max-width:90%;text-align:center;pointer-events:auto;
}
.toast.undo-toast{display:flex;align-items:center;gap:14px;text-align:left;padding:10px 10px 10px 18px;}
.toast.undo-toast .undo-btn{background:var(--gold);color:var(--teal-dark);border:none;border-radius:16px;padding:8px 15px;font-weight:800;font-size:12.5px;flex-shrink:0;}
footer.foot-credit{
  text-align:center;font-size:10.5px;color:var(--ink-faint);padding:18px 24px 4px;line-height:1.6;
}

   STORAGE ADAPTER
   Uses window.storage when running as a Claude artifact.
   Falls back to localStorage automatically once this file
   is deployed on its own (double-clic, Netlify, Vercel...)
   where window.storage does not exist.
========================================================= */
const STORE_KEY = 'shop-data-v2';
const hasArtifactStorage = () => typeof window.storage !== 'undefined' && window.storage !== null;

async function storageGet(key){
  if(hasArtifactStorage()){
    try{
      const r = await window.storage.get(key, false);
      return r ? r.value : null;
    }catch(e){
      try{ return localStorage.getItem(key); }catch(e2){ return null; }
    }
  }else{
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
}
async function storageSet(key, value){
  if(hasArtifactStorage()){
    try{ await window.storage.set(key, value, false); }
    catch(e){ try{ localStorage.setItem(key, value); }catch(e2){ console.error('Échec de sauvegarde', e2); } }
  }else{
    try{ localStorage.setItem(key, value); }catch(e){ console.error('Échec de sauvegarde', e); }
  }
}

let state = defaultState();
let cart = [];
let currentView = 'dashboard';
let pinBuffer = '';

let productsFilterCat = 'all';

let suiviSubtab = 'ventes';

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

async function loadState(){
  let raw = null;
  if(window.gouwenkouniCloud && window.gouwenkouniCloud.isSignedIn()){
    try{ raw = await window.gouwenkouniCloud.cloudLoad(); }catch(e){ console.error('Lecture cloud impossible', e); }
  }
  if(!raw){ raw = await storageGet(STORE_KEY); }
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      state = Object.assign(defaultState(), parsed);
      if(!state.categories || !state.categories.length) state.categories = JSON.parse(JSON.stringify(DEFAULT_CATEGORIES));
      if(!state.users || !state.users.length) state.users = [{id:'u-default', nom: state.config.ownerName || 'Moi', role:'proprietaire'}];
      if(!state.users.some(u=>u.role==='proprietaire')) state.users[0].role = 'proprietaire';
      state.users.forEach(u=>{ if(!u.role) u.role='employe'; });
      if(state.config.ownerPin===undefined) state.config.ownerPin = '';
      if(state.config.logo===undefined) state.config.logo = '';
      if(state.config.soldeInitial===undefined) state.config.soldeInitial = 0;
      if(!state.activityLog) state.activityLog = [];
      if(!state.activeUserId || !state.users.some(u=>u.id===state.activeUserId)) state.activeUserId = state.users[0].id;
    }catch(e){ state = defaultState(); }
  }else{
    state = defaultState();
  }
}
async function saveState(){
  const json = JSON.stringify(state);
  await storageSet(STORE_KEY, json);
  if(window.gouwenkouniCloud && window.gouwenkouniCloud.isSignedIn()){
    window.gouwenkouniCloud.cloudSave(json).catch(e=>console.error('Sauvegarde cloud impossible', e));
  }
}

function catById(id){
  return state.categories.find(c=>c.id===id) || {id:'autres', label:'Autres', color:'#8A7B6C'};
}
function fmt(n){
  n = Math.round(Number(n)||0);
  return n.toLocaleString('fr-FR');
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isSameDay(iso, dayStr){ return iso.slice(0,10) === dayStr; }
function startOfWeek(){
  const d = new Date();
  const day = (d.getDay()+6)%7;
  d.setHours(0,0,0,0);
  d.setDate(d.getDate()-day);
  return d;
}
function startOfMonth(){
  const d = new Date();
  d.setDate(1); d.setHours(0,0,0,0);
  return d;
}
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================
   UTILISATEURS & JOURNAL D'ACTIVITÉ (traçabilité)
========================================================= */
function currentUser(){
  return state.users.find(u=>u.id===state.activeUserId) || state.users[0];
}
function isOwner(){
  const u = currentUser();
  return !!u && u.role==='proprietaire';
}
function logActivity(action, detail){

/* =========================================================
   LOTS (cost tracking for gain / perte)
========================================================= */
function lotsForProduct(productId){
  return state.lots.filter(l=>l.productId===productId && l.qtyRemaining>0)
    .sort((a,b)=> new Date(a.dateISO)-new Date(b.dateISO));
}
function addLot(productId, qty, coutUnitaire, commandeId, source, dateISO){
  const lot = {id:uid(), productId, commandeId: commandeId||null, qtyInitial:qty, qtyRemaining:qty, coutUnitaire:Number(coutUnitaire)||0, dateISO:dateISO||new Date().toISOString(), source: source||'manuel'};
  state.lots.push(lot);
  return lot;
}
// Consomme le stock d'un produit (FIFO sur les lots) pour une vente, renvoie le cout moyen et le detail des lots consommes
function consumeStock(productId, qty){
  const product = state.products.find(p=>p.id===productId);
  let remaining = qty;
  let totalCost = 0;
  const lotConsumptions = [];
  const lots = lotsForProduct(productId);
  for(const lot of lots){
    if(remaining<=0) break;
    const take = Math.min(remaining, lot.qtyRemaining);
    if(take<=0) continue;
    lot.qtyRemaining -= take;
    totalCost += take*lot.coutUnitaire;
    lotConsumptions.push({lotId:lot.id, commandeId:lot.commandeId, qty:take, coutUnitaire:lot.coutUnitaire});
    remaining -= take;
  }
  if(remaining>0){
    // stock ancien sans lot (ex: article cree avant cette fonctionnalite) -> on utilise le prix d'achat du produit comme cout approximatif
    const approxCost = product ? (product.priceAchat||0) : 0;
    totalCost += remaining*approxCost;
    lotConsumptions.push({lotId:null, commandeId:null, qty:remaining, coutUnitaire:approxCost});
  }
  return {coutUnitaireMoyen: qty>0 ? totalCost/qty : 0, lotConsumptions};
}

function toast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}
function showUndoToast(msg, onUndo, timeoutMs){
  timeoutMs = timeoutMs || 6000;
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast undo-toast';
  el.innerHTML = `<span>${escapeHtml(msg)}</span><button class="undo-btn">Annuler</button>`;
  root.appendChild(el);
  let done = false;
  const timer = setTimeout(()=>{ if(!done){ done=true; el.remove(); } }, timeoutMs);
  el.querySelector('.undo-btn').addEventListener('click', async ()=>{
    if(done) return;
    done = true;
    clearTimeout(timer);
    el.remove();
    await onUndo();
  });
}
function openModal(innerHtml, onMount){
  const root = document.getElementById('modal-root');

function totalDepotsAPercevoir(){
  return state.depots.reduce((sum,d)=>{
    const attendu = d.items.reduce((a,it)=>a+(it.qty-it.qtyRendue)*it.priceUnit,0);
    const recu = d.versements.reduce((a,v)=>a+v.montant,0);
    return sum + Math.max(0, attendu-recu);
  },0);
}
function totalCreditsAPercevoir(){
  return state.creditClients.reduce((sum,c)=>sum+Math.max(0,c.solde),0);
}
// Calcule automatiquement le solde de caisse (espèces) après chaque entrée/sortie :
// fond de départ + ventes en espèces + versements de dépôts reçus + paiements de crédits reçus - dépenses
function computeSoldeCaisse(){
  const initial = Number(state.config.soldeInitial)||0;
  const ventesEspeces = state.sales
    .filter(s=>s.paymentMode==='Espèces')
    .reduce((a,s)=>a + (s.montantRecu - s.monnaie), 0);
  const versementsDepots = state.depots.reduce((a,d)=>a + d.versements.reduce((x,v)=>x+v.montant,0), 0);
  const paiementsCredits = state.creditClients.reduce((a,c)=>
    a + c.historique.filter(h=>h.type==='paiement').reduce((x,h)=>x+h.montant,0), 0);
  const depenses = state.expenses.reduce((a,e)=>a+e.amount,0);
  return initial + ventesEspeces + versementsDepots + paiementsCredits - depenses;
}

function addToCart(productId, n){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return false;
  n = Math.floor(Number(n)); if(!isFinite(n) || n<1) n = 1;
  const inCartQty = cart.filter(c=>c.productId===productId).reduce((a,c)=>a+c.qty,0);
  if(inCartQty + n > p.stock){
    const dispo = Math.max(0, p.stock - inCartQty);
    toast(dispo>0 ? 'Stock insuffisant : '+dispo+' disponible(s) pour '+p.name : 'Stock insuffisant pour '+p.name);
    return false;
  }
  const existing = cart.find(c=>c.productId===productId);
  if(existing) existing.qty += n;
  else cart.push({productId:p.id, name:p.name, categoryId:p.categoryId, priceUnit:p.priceVente, qty:n});
  toast(n+' × '+p.name+' ajouté'+(n>1?'s':''));
  renderFloatCart();
  return true;
}

// Vente en 1 tap : enregistre immédiatement 1 unité payée en espèces, sans passer par le panier.
// Un bouton "Annuler" reste disponible quelques secondes en cas d'erreur.
async function quickSale(productId, n){
  const p = state.products.find(x=>x.id===productId);
  if(!p || p.stock<=0){ toast('Rupture de stock'); return; }
  n = Math.floor(Number(n)); if(!isFinite(n) || n<1) n = 1;
  if(n > p.stock){ toast('Stock insuffisant : '+p.stock+' disponible(s) pour '+p.name); return; }
  const cons = consumeStock(p.id, n);
  p.stock -= n;
  const priceUnit = p.priceVente;
  const totalLigne = priceUnit * n;
  const item = {
    productId:p.id, name:p.name, categoryId:p.categoryId, qty:n, priceUnit, total:totalLigne,
    coutUnitaireMoyen: cons.coutUnitaireMoyen, lotConsumptions: cons.lotConsumptions
  };
  const sale = {
    id:uid(), dateISO:new Date().toISOString(), items:[item], total:totalLigne,
    paymentMode:'Espèces', montantRecu:totalLigne, monnaie:0, creditClientId:null, montantCredit:0,
    recordedBy: currentUser() ? currentUser().nom : ''
  };
  state.sales.push(sale);
  logActivity('Vente rapide', `${p.name} x${n} · ${fmt(totalLigne)} ${state.config.currency}`);
  await saveState();
  renderPOS();
  showUndoToast(`Vente enregistrée : ${n} × ${p.name} — ${fmt(totalLigne)} ${state.config.currency}`, async ()=>{
    item.lotConsumptions.forEach(lc=>{
      if(lc.lotId){ const lot = state.lots.find(l=>l.id===lc.lotId); if(lot) lot.qtyRemaining += lc.qty; }
    });
    p.stock += n;
    state.sales = state.sales.filter(s=>s.id!==sale.id);
    logActivity('Vente rapide annulée', p.name);
    await saveState();
    renderPOS();
    toast('Vente annulée');
  });
}
function cartTotal(){ return cart.reduce((a,c)=>a+c.qty*c.priceUnit,0); }
function cartCount(){ return cart.reduce((a,c)=>a+c.qty,0); }

function renderFloatCart(){
  const existing = document.querySelector('.floatcart');
  if(existing) existing.remove();
  if(currentView!=='pos' || cart.length===0) return;
  const el = document.createElement('div');
  el.className = 'floatcart';
  el.innerHTML = `<div class="cinfo"><b>${fmt(cartTotal())} ${state.config.currency}</b><small>${cartCount()} article(s)</small></div>
    <button id="open-cart">Voir le panier</button>`;
  document.getElementById('app').appendChild(el);
  document.getElementById('open-cart').addEventListener('click', openCartModal);
}

function clientOptions(){
  return state.creditClients.map(c=>`<option value="${c.id}">${escapeHtml(c.nom)}${c.telephone?' - '+escapeHtml(c.telephone):''} (doit ${fmt(c.solde)})</option>`).join('');
}

function openCartModal(){
  if(cart.length===0){ toast('Panier vide'); return; }
  const lines = cart.map((c,i)=>{
    const cat = catById(c.categoryId);
    return `<div class="cartline" data-i="${i}">
      <span class="tagdot" style="background:${cat.color}"></span>
      <div style="flex:1">
        <div class="cname">${escapeHtml(c.name)}</div>
        <div class="cprice">${fmt(c.priceUnit)} ${state.config.currency} / unité</div>
      </div>
      <div class="stepper">
        <button data-dec="${i}">−</button><input type="number" class="qty-input" data-qty="${i}" value="${c.qty}" min="1" step="1" inputmode="numeric" aria-label="Quantité"><button data-inc="${i}">+</button>
      </div>
      <div class="ctotal">${fmt(c.qty*c.priceUnit)}</div>
      <button class="rm" data-rm="${i}">✕</button>
    </div>`;
  }).join('');

  const html = `
    <div class="modal-title">Panier</div>
    <div id="cart-lines">${lines}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-family:'Fraunces',serif;font-size:20px;font-weight:600;">
      <span>Total</span><span>${fmt(cartTotal())} ${state.config.currency}</span>
    </div>
    <div class="field"><label>Mode de paiement</label>
      <div class="paymode">
        <button data-pay="Espèces" class="active">Espèces</button>
        <button data-pay="Mobile Money">Mobile Money</button>
        <button data-pay="Crédit">Crédit</button>
      </div>
    </div>
    <div class="field" id="recu-field"><label>Montant reçu</label><input type="number" id="montant-recu" placeholder="0" inputmode="numeric"></div>
    <div id="monnaie-line" style="font-size:13px;color:var(--ink-soft);margin:-8px 0 14px;"></div>

    <div id="credit-fields" class="hidden">
      <div class="field"><label>Client</label>
        <select id="credit-client-select">
          <option value="__new__">+ Nouveau client</option>
          ${clientOptions()}
        </select>
      </div>
      <div class="field-row" id="new-client-fields">
        <div class="field"><label>Nom du client</label><input id="new-client-nom" placeholder="Nom"></div>
        <div class="field"><label>Téléphone</label><input id="new-client-tel" placeholder="Optionnel"></div>
      </div>
      <div class="field"><label>Montant payé maintenant (optionnel)</label><input type="number" id="montant-paye-maintenant" placeholder="0"></div>
      <div class="field hint" style="font-size:12px;color:var(--ink-soft);">Le reste sera enregistré comme crédit à recevoir de ce client.</div>
    </div>

    <button class="btn btn-primary" id="valider-vente">Valider la vente</button>
    <button class="btn btn-ghost" style="margin-top:10px;" id="vider-panier">Vider le panier</button>
  `;
  openModal(html, ()=>{
    let payMode = 'Espèces';
    document.querySelectorAll('[data-pay]').forEach(b=>b.addEventListener('click', ()=>{
      document.querySelectorAll('[data-pay]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active'); payMode = b.dataset.pay;
      document.getElementById('recu-field').style.display = payMode==='Espèces' ? 'block' : 'none';
      document.getElementById('credit-fields').classList.toggle('hidden', payMode!=='Crédit');
      updateMonnaie();
    }));
    function updateMonnaie(){
      const recu = Number(document.getElementById('montant-recu').value)||0;
      const diff = recu - cartTotal();
      const line = document.getElementById('monnaie-line');
      if(payMode!=='Espèces' || recu===0){ line.textContent=''; return; }
      line.textContent = diff>=0 ? `Monnaie à rendre : ${fmt(diff)} ${state.config.currency}` : `Il manque ${fmt(-diff)} ${state.config.currency}`;
    }
    document.getElementById('montant-recu').addEventListener('input', updateMonnaie);

    const clientSelect = document.getElementById('credit-client-select');
    clientSelect.addEventListener('change', ()=>{
      document.getElementById('new-client-fields').style.display = clientSelect.value==='__new__' ? 'flex' : 'none';
    });

    document.querySelectorAll('[data-inc]').forEach(b=>b.addEventListener('click', ()=>{
      const i = Number(b.dataset.inc);
      const p = state.products.find(x=>x.id===cart[i].productId);
      const inCart = cart[i].qty;
      if(p && inCart>=p.stock){ toast('Stock maximum atteint'); return; }
      cart[i].qty++; openCartModal();
    }));
    document.querySelectorAll('[data-dec]').forEach(b=>b.addEventListener('click', ()=>{
      const i = Number(b.dataset.dec);
      cart[i].qty--; if(cart[i].qty<=0) cart.splice(i,1);
      openCartModal();
    }));
    document.querySelectorAll('[data-qty]').forEach(inp=>{
      inp.addEventListener('focus', ()=>inp.select());
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } });
      inp.addEventListener('change', ()=>{
        const i = Number(inp.dataset.qty);
        const line = cart[i]; if(!line) return;
        let v = Math.floor(Number(inp.value));
        if(!isFinite(v) || v<1) v = 1;
        const p = state.products.find(x=>x.id===line.productId);
        const autres = cart.filter((c,k)=>k!==i && c.productId===line.productId).reduce((a,c)=>a+c.qty,0);
        if(p && v+autres>p.stock){
          v = Math.max(1, p.stock-autres);
          toast('Stock maximum atteint ('+p.stock+')');
        }
        line.qty = v; openCartModal();
      });
    });
    document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click', ()=>{
      cart.splice(Number(b.dataset.rm),1); openCartModal();
    }));
    document.getElementById('vider-panier').addEventListener('click', ()=>{
      cart = []; closeModal(); renderFloatCart(); toast('Panier vidé');
    });
    document.getElementById('valider-vente').addEventListener('click', async ()=>{
      const recu = Number(document.getElementById('montant-recu').value)||0;
      if(payMode==='Espèces' && recu < cartTotal()){
        if(!confirm('Le montant reçu est inférieur au total. Continuer quand même ?')) return;
      }
      let creditInfo = null;
      if(payMode==='Crédit'){
        const paidNow = Number(document.getElementById('montant-paye-maintenant').value)||0;
        const selectVal = clientSelect.value;
        let clientId, clientNom, clientTel;
        if(selectVal==='__new__'){
          clientNom = document.getElementById('new-client-nom').value.trim();
          clientTel = document.getElementById('new-client-tel').value.trim();
          if(!clientNom){ toast('Entrez le nom du client'); return; }
        }else{
          const existing = state.creditClients.find(c=>c.id===selectVal);
          clientId = existing.id; clientNom = existing.nom; clientTel = existing.telephone;
        }
        creditInfo = {clientId, clientNom, clientTel, paidNow};
      }
      await finalizeSale(payMode, recu, creditInfo);
    });
  });
}

function findOrCreateClient(clientId, nom, telephone){
  if(clientId){
    return state.creditClients.find(c=>c.id===clientId);
  }
  const client = {id:uid(), nom, telephone:telephone||'', solde:0, historique:[]};
  state.creditClients.push(client);
  return client;
}

async function finalizeSale(payMode, recu, creditInfo){
  for(const c of cart){
    const p = state.products.find(x=>x.id===c.productId);
    if(!p || p.stock < c.qty){ toast('Stock insuffisant pour '+c.name); return; }
  }
  const total = cartTotal();

  const saleItems = cart.map(c=>{
    const cons = consumeStock(c.productId, c.qty);
    const p = state.products.find(x=>x.id===c.productId);
    if(p) p.stock -= c.qty;
    return {
      productId:c.productId, name:c.name, categoryId:c.categoryId, qty:c.qty,
      priceUnit:c.priceUnit, total:c.qty*c.priceUnit,
      coutUnitaireMoyen: cons.coutUnitaireMoyen, lotConsumptions: cons.lotConsumptions
    };
  });

  let montantRecu = total, monnaie = 0, creditClientId = null, montantCredit = 0;

  if(payMode==='Espèces'){ montantRecu = recu; monnaie = Math.max(0, recu-total); }
  else if(payMode==='Mobile Money'){ montantRecu = total; monnaie = 0; }
  else if(payMode==='Crédit'){
    const client = findOrCreateClient(creditInfo.clientId, creditInfo.clientNom, creditInfo.clientTel);
    const paidNow = Math.min(creditInfo.paidNow||0, total);
    montantCredit = total - paidNow;
    montantRecu = paidNow; monnaie = 0; creditClientId = client.id;
    client.solde += montantCredit;
    client.historique.push({
      id:uid(), dateISO:new Date().toISOString(), type:'vente',
      montant: montantCredit, description: `Achat: ${saleItems.map(it=>it.name+' x'+it.qty).join(', ')}`
    });
  }

  const sale = {
    id: uid(), dateISO: new Date().toISOString(), items: saleItems, total,
    paymentMode: payMode, montantRecu, monnaie, creditClientId, montantCredit,
    recordedBy: currentUser() ? currentUser().nom : ''
  };
  state.sales.push(sale);
  logActivity('Vente', `${fmt(total)} ${state.config.currency} · ${saleItems.length} article(s) · ${payMode}`);
  await saveState();
  showReceipt(sale);
  cart = [];
  renderFloatCart();
  renderPOS();
}

// Construit un lien WhatsApp pré-rempli. Si un numéro est fourni, l'ouvre directement avec ce contact,
// sinon ouvre WhatsApp pour qu'elle choisisse elle-même le destinataire.
function whatsappShareUrl(phone, text){
  const encoded = encodeURIComponent(text);
  if(phone){
    let clean = String(phone).replace(/[^\d]/g,'');
    if(clean.length===8) clean = '226'+clean; // indicatif Burkina Faso
    return `https://wa.me/${clean}?text=${encoded}`;
  }
  return `https://wa.me/?text=${encoded}`;
}
function receiptNumber(seed){
  return String(seed||uid()).replace(/[^a-zA-Z0-9]/g,'').slice(-6).toUpperCase();
}
// Modale de reçu générique réutilisable : ventes, paiements de crédit, versements de dépôt...

  const numero = receiptNumber(heading + dateISO);
  const html = `
    <div class="receipt-head">

    </div>
    <div class="receipt">
      <div class="rline" style="font-weight:700;"><span>${escapeHtml(heading)}</span><span>N° ${numero}</span></div>
      <div style="border-top:1px dashed var(--ink-faint); margin:6px 0;"></div>
      ${linesHtml}
      <div class="rline rtotal"><span>${escapeHtml(totalLabel)}</span><span>${fmt(totalValue)} ${state.config.currency}</span></div>
      ${extraLinesHtml||''}
    </div>

    <div class="field" style="margin-top:16px;">
      <label>Numéro WhatsApp du client (optionnel)</label>
      <input id="receipt-wa-phone" type="tel" placeholder="Ex: 70 12 34 56" value="${whatsappPhone?escapeHtml(whatsappPhone):''}">
      <div class="hint">Laissez vide pour choisir le contact directement dans WhatsApp.</div>
    </div>
    <button class="btn btn-primary" id="print-receipt-btn">🖨️ Imprimer le reçu</button>
    <button class="btn btn-gold" style="margin-top:10px;" id="whatsapp-receipt-btn">💬 Envoyer sur WhatsApp</button>
    <button class="btn btn-ghost" style="margin-top:10px;" id="close-receipt-btn">${closeLabel||'Fermer'}</button>
  `;
  openModal(html, ()=>{
    document.getElementById('close-receipt-btn').addEventListener('click', ()=>{ closeModal(); if(onClose) onClose(); });
    document.getElementById('print-receipt-btn').addEventListener('click', ()=>{
      document.body.classList.add('print-modal-only');
      window.addEventListener('afterprint', function cleanup(){
        document.body.classList.remove('print-modal-only');
        window.removeEventListener('afterprint', cleanup);
      }, {once:true});
      window.print();
    });
    document.getElementById('whatsapp-receipt-btn').addEventListener('click', ()=>{
      const typedPhone = document.getElementById('receipt-wa-phone').value.trim();
      window.open(whatsappShareUrl(typedPhone, whatsappText), '_blank');
    });
  });
}

function showReceipt(sale){
  const linesHtml = sale.items.map(it=>`<div class="rline"><span>${escapeHtml(it.name)} x${it.qty}</span><span>${fmt(it.total)}</span></div>`).join('');

  let extraLinesHtml = `<div class="rline"><span>Mode de paiement</span><span>${escapeHtml(sale.paymentMode)}</span></div>`;
  if(sale.paymentMode==='Espèces'){
    extraLinesHtml += `<div class="rline"><span>Montant donné par le client</span><span>${fmt(sale.montantRecu)} ${state.config.currency}</span></div>`;
    extraLinesHtml += `<div class="rline" style="font-weight:700;"><span>Monnaie à rendre</span><span>${fmt(sale.monnaie)} ${state.config.currency}</span></div>`;
  }
  if(sale.paymentMode==='Crédit' && sale.montantCredit>0){
    extraLinesHtml += `<div class="rline" style="color:var(--coral);font-weight:700;"><span>Reste à crédit</span><span>${fmt(sale.montantCredit)} ${state.config.currency}</span></div>`;
  }

  let waText = `${state.config.shopName}\nReçu de vente\n${new Date(sale.dateISO).toLocaleString('fr-FR')}\n\n`+
    sale.items.map(it=>`${it.name} x${it.qty} = ${fmt(it.total)} ${state.config.currency}`).join('\n')+
    `\n\nTOTAL: ${fmt(sale.total)} ${state.config.currency}\nPaiement: ${sale.paymentMode}`;
  if(sale.paymentMode==='Espèces'){
    waText += `\nMontant donné: ${fmt(sale.montantRecu)} ${state.config.currency}\nMonnaie rendue: ${fmt(sale.monnaie)} ${state.config.currency}`;
  }
  if(sale.paymentMode==='Crédit' && sale.montantCredit>0){
    waText += `\nReste à crédit: ${fmt(sale.montantCredit)} ${state.config.currency}`;
  }
  waText += `\n\nMerci de votre confiance !`;

  let whatsappPhone = '';
  if(sale.creditClientId){
    const c = state.creditClients.find(cc=>cc.id===sale.creditClientId);
    if(c) whatsappPhone = c.telephone;
  }

  renderReceiptModal({
    heading: 'Reçu de vente',
    dateISO: sale.dateISO,
    linesHtml,
    totalLabel: 'TOTAL',
    totalValue: sale.total,
    extraLinesHtml,
    whatsappText: waText,
    whatsappPhone,
    closeLabel: 'Nouvelle vente'
  });
}

function catOptions(selectedId){
  return state.categories.map(c=>`<option value="${c.id}" ${c.id===selectedId?'selected':''}>${escapeHtml(c.label)}</option>`).join('');
}

function renderProduitsSub(){
  const cats = state.categories;
  let chips = `<button class="chip ${productsFilterCat==='all'?'active':''}" data-pcat="all" style="${productsFilterCat==='all'?'background:#241F1A':''}">Tout</button>`;
  chips += cats.map(c=>`<button class="chip ${productsFilterCat===c.id?'active':''}" data-pcat="${c.id}" style="${productsFilterCat===c.id?'background:'+c.color:''}">${escapeHtml(c.label)}</button>`).join('');

  let list = state.products.filter(p=> productsFilterCat==='all' || p.categoryId===productsFilterCat);
  if(productsSearch.trim()){
    const q = productsSearch.toLowerCase();
    list = list.filter(p=>p.name.toLowerCase().includes(q));
  }

  let grid = list.length===0 ? `<div class="empty-note" style="padding:20px 4px;">Aucun article. Touchez le bouton + pour ajouter votre premier produit.</div>` :
    `<div class="pgrid">${list.map(p=>{
      const c = catById(p.categoryId);

      return `<div class="pcard" style="border-top-color:${c.color}">
        <span class="tag" style="background:${c.color}">${escapeHtml(c.label)}</span>

        <button class="editbtn" data-edit="${p.id}">✎</button>
      </div>`;
    }).join('')}</div>`;

  document.getElementById('stock-body').innerHTML = `
    <div class="searchbar" style="margin-top:14px;">
      <span>🔎</span><input id="psearch" placeholder="Rechercher un article..." value="${escapeHtml(productsSearch)}">
    </div>
    <div class="chipbar">${chips}</div>

    productsSearch = e.target.value; renderProduitsSub();
    setTimeout(()=>{ const el=document.getElementById('psearch'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0);

  document.getElementById('add-product').addEventListener('click', ()=>openProductForm(null));

    openProductForm(state.products.find(p=>p.id===b.dataset.edit));

  document.querySelectorAll('[data-restock]').forEach(b=>b.addEventListener('click', ()=>{

      <div class="field"><label>Prix de vente</label><input id="f-vente" type="number" value="${isEdit?product.priceVente:''}" placeholder="0"></div>
    </div>
    <div class="field"><label>Stock actuel</label><input id="f-stock" type="number" value="${isEdit?product.stock:0}">
      <div class="hint">${isEdit ? 'Pour un réapprovisionnement avec suivi du gain, utilisez plutôt "+ Stock rapide" ou l\u2019onglet Achats.' : 'Le stock de départ sera enregistré avec le prix d\u2019achat ci-dessus.'}</div>
    </div>

    ${isEdit?'<button class="btn btn-danger" style="margin-top:10px;" id="delete-product">Supprimer l\u2019article</button>':''}

      const vente = Number(document.getElementById('f-vente').value)||0;
      const achat = Number(document.getElementById('f-achat').value)||0;
      const newStock = Number(document.getElementById('f-stock').value)||0;
      if(isEdit){
        const diff = newStock - product.stock;
        product.name = name;
        product.categoryId = document.getElementById('f-cat').value;
        product.unit = document.getElementById('f-unit').value.trim();
        product.seuilAlerte = Number(document.getElementById('f-seuil').value)||0;
        product.priceAchat = achat;
        product.priceVente = vente;
        product.stock = newStock;
        if(diff>0){ addLot(product.id, diff, achat, null, 'correction'); }
      }else{
        const p = {
          id: uid(), name, categoryId: document.getElementById('f-cat').value,
          unit: document.getElementById('f-unit').value.trim(),
          seuilAlerte: Number(document.getElementById('f-seuil').value)||0,
          priceAchat: achat, priceVente: vente, stock: newStock,
          createdAt: new Date().toISOString()
        };
        state.products.push(p);
        if(newStock>0) addLot(p.id, newStock, achat, null, 'initial');
      }
      logActivity(isEdit?'Article modifié':'Article ajouté', name);
      await saveState();
      closeModal(); renderProduitsSub(); toast(isEdit?'Article mis à jour':'Article ajouté');
    });
    if(isEdit){
      document.getElementById('delete-product').addEventListener('click', async ()=>{
        if(!confirm('Supprimer définitivement cet article ?')) return;
        state.products = state.products.filter(p=>p.id!==product.id);
        logActivity('Article supprimé', product.name);
        await saveState(); closeModal(); renderProduitsSub(); toast('Article supprimé');
      });
    }
  });
}

/* ---------- ACHATS (commandes fournisseurs) ---------- */
function commandeStats(commande){
  const lotIds = state.lots.filter(l=>l.commandeId===commande.id).map(l=>l.id);
  let qtyVendue = 0, revenu = 0, cout = 0;
  state.sales.forEach(s=> s.items.forEach(it=>{
    (it.lotConsumptions||[]).forEach(lc=>{
      if(lotIds.includes(lc.lotId)){
        qtyVendue += lc.qty;
        revenu += lc.qty*it.priceUnit;
        cout += lc.qty*lc.coutUnitaire;
      }
    });
  }));
  const lots = state.lots.filter(l=>l.commandeId===commande.id);
  const qtyRestante = lots.reduce((a,l)=>a+l.qtyRemaining,0);
  const valeurStockRestant = lots.reduce((a,l)=>a+l.qtyRemaining*l.coutUnitaire,0);
  const qtyTotale = lots.reduce((a,l)=>a+l.qtyInitial,0);
  return {qtyVendue, revenu, cout, gain: revenu-cout, qtyRestante, valeurStockRestant, qtyTotale};
}

function renderAchatsSub(){
  const commandes = [...state.commandes].sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO));

function openCommandeForm(){
  let lignes = [{productId:'', newName:'', categoryId:state.categories[0].id, unit:'pièce', prixVente:'', qty:'', coutTotal:''}];

  function ligneHtml(l, i){
    const isNew = !l.productId;

      ${lignes.length>1 ? `<button class="rm-ligne" data-rmli="${i}">✕</button>` : ''}

      <div class="new-fields-${i}" style="${isNew?'':'display:none'}">
        <div class="field"><label>Nom du nouvel article</label><input class="li-newname" data-idx="${i}" value="${escapeHtml(l.newName)}" placeholder="Nom de l'article"></div>
        <div class="field-row">

          <div class="field"><label>Unité</label><input class="li-unit" data-idx="${i}" value="${escapeHtml(l.unit)}" placeholder="pièce, litre..."></div>
        </div>
        <div class="field"><label>Prix de vente prévu</label><input class="li-vente" data-idx="${i}" type="number" value="${l.prixVente}" placeholder="0"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantité achetée</label><input class="li-qty" data-idx="${i}" type="number" value="${l.qty}" placeholder="0"></div>
        <div class="field"><label>Coût total de la ligne</label><input class="li-cout" data-idx="${i}" type="number" value="${l.coutTotal}" placeholder="0"></div>
      </div>
      <div class="ligne-total" data-lt="${i}"></div>
    </div>`;
  }

  function fullHtml(){
    const total = lignes.reduce((a,l)=>a+(Number(l.coutTotal)||0),0);
    return `
      <div class="modal-title">Nouvel achat</div>
      <div class="modal-sub">Enregistrez ce que vous avez dépensé pour acquérir des articles. Le gain sera calculé au fur et à mesure des ventes.</div>
      <div class="field"><label>Fournisseur</label><input id="cmd-fournisseur" placeholder="Nom du fournisseur (optionnel)"></div>
      <div id="lignes-root">${lignes.map(ligneHtml).join('')}</div>
      <button class="add-ligne-btn" id="add-ligne">+ Ajouter un article à cet achat</button>
      <div style="display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:18px;font-weight:600;padding:6px 2px 18px;">
        <span>Total dépensé</span><span>${fmt(total)} ${state.config.currency}</span>
      </div>
      <button class="btn btn-primary" id="save-commande">Enregistrer l\u2019achat</button>
    `;
  }

  function mount(){
    document.getElementById('add-ligne').addEventListener('click', ()=>{
      lignes.push({productId:'', newName:'', categoryId:state.categories[0].id, unit:'pièce', prixVente:'', qty:'', coutTotal:''});
      rerender();
    });
    document.querySelectorAll('.rm-ligne').forEach(b=>b.addEventListener('click', ()=>{
      lignes.splice(Number(b.dataset.rmli),1); rerender();
    }));
    document.querySelectorAll('.ligne-product').forEach(sel=>sel.addEventListener('change', ()=>{
      const idx = Number(sel.dataset.idx);
      lignes[idx].productId = sel.value;
      if(sel.value){
        const p = state.products.find(pp=>pp.id===sel.value);
        lignes[idx].prixVente = p.priceVente;
      }
      rerender();
    }));
    document.querySelectorAll('.li-newname').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].newName = inp.value; }));
    document.querySelectorAll('.li-cat').forEach(inp=>inp.addEventListener('change', ()=>{ lignes[Number(inp.dataset.idx)].categoryId = inp.value; }));
    document.querySelectorAll('.li-unit').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].unit = inp.value; }));
    document.querySelectorAll('.li-vente').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].prixVente = inp.value; }));
    document.querySelectorAll('.li-qty').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].qty = inp.value; updateTotals(); }));
    document.querySelectorAll('.li-cout').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].coutTotal = inp.value; updateTotals(); }));
    updateTotals();

    document.getElementById('save-commande').addEventListener('click', async ()=>{
      const fournisseur = document.getElementById('cmd-fournisseur').value.trim();
      if(lignes.length===0 || lignes.every(l=>!l.qty)){ toast('Ajoutez au moins un article'); return; }
      const commandeId = uid();
      const cmdLignes = [];
      let montantTotal = 0;
      for(const l of lignes){
        const qty = Number(l.qty)||0;
        const coutTotal = Number(l.coutTotal)||0;
        if(qty<=0) continue;
        let product;
        if(l.productId){
          product = state.products.find(p=>p.id===l.productId);
        }else{
          if(!l.newName || !l.newName.trim()){ toast('Nom manquant pour un nouvel article'); return; }
          product = {
            id: uid(), name:l.newName.trim(), categoryId:l.categoryId, unit:l.unit||'pièce',
            seuilAlerte:3, priceAchat: qty>0?coutTotal/qty:0, priceVente: Number(l.prixVente)||0,
            stock:0, createdAt:new Date().toISOString()
          };
          state.products.push(product);
        }
        const coutUnitaire = qty>0 ? coutTotal/qty : 0;
        product.stock += qty;
        if(l.productId && l.prixVente!=='' && l.prixVente!==undefined){ product.priceVente = Number(l.prixVente)||product.priceVente; }
        product.priceAchat = coutUnitaire || product.priceAchat;
        const lot = addLot(product.id, qty, coutUnitaire, commandeId, 'achat');
        cmdLignes.push({productId:product.id, name:product.name, categoryId:product.categoryId, qty, coutTotal, coutUnitaire, lotId:lot.id});
        montantTotal += coutTotal;
      }
      if(cmdLignes.length===0){ toast('Aucune ligne valide'); return; }
      state.commandes.push({id:commandeId, dateISO:new Date().toISOString(), fournisseur, lignes:cmdLignes, montantTotal, recordedBy: currentUser()?currentUser().nom:''});
      logActivity('Achat', `${fournisseur?fournisseur+' · ':''}${fmt(montantTotal)} ${state.config.currency}`);
      await saveState();
      closeModal(); renderAchatsSub(); toast('Achat enregistré');
    });
  }

  function updateTotals(){
    lignes.forEach((l,i)=>{
      const el = document.querySelector(`[data-lt="${i}"]`);
      if(el){
        const qty = Number(l.qty)||0, cout = Number(l.coutTotal)||0;
        el.textContent = qty>0 ? `Coût unitaire : ${fmt(cout/qty)} ${state.config.currency} / unité` : '';
      }
    });
    const total = lignes.reduce((a,l)=>a+(Number(l.coutTotal)||0),0);
    const totalEl = document.querySelector('.modal-sheet');
  }

  function rerender(){
    openModal(fullHtml(), mount);
  }
  rerender();
}

function rangeBtns(){
  return ['today','week','month','all'].map(r=>{
    const label = {today:'Aujourd\u2019hui',week:'Semaine',month:'Mois',all:'Tout'}[r];
    return `<button class="chip ${historyRange===r?'active':''}" data-range="${r}" style="${historyRange===r?'background:#241F1A':''}">${label}</button>`;
  }).join('');
}
function inRange(dateISO){
  const d = new Date(dateISO);
  if(historyRange==='today') return isSameDay(dateISO, todayStr());
  if(historyRange==='week') return d >= startOfWeek();
  if(historyRange==='month') return d >= startOfMonth();
  return true;
}

function renderVentesSub(){
  const salesInRange = state.sales.filter(s=>inRange(s.dateISO)).sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO));
  const expensesInRange = state.expenses.filter(e=>inRange(e.dateISO));
  const revenue = salesInRange.reduce((a,s)=>a+s.total,0);
  const cogs = salesInRange.reduce((a,s)=> a + s.items.reduce((x,it)=>x+it.qty*(it.coutUnitaireMoyen||0),0), 0);
  const expTotal = expensesInRange.reduce((a,e)=>a+e.amount,0);
  const profit = revenue - cogs - expTotal;

  const rows = salesInRange.length===0 ? `<div class="empty-note" style="padding:20px 4px;">Aucune vente sur cette période.</div>` :
    salesInRange.map(s=>`
      <div class="row-card" data-sale="${s.id}">
        <div class="l"><b>${s.items.length} article(s)</b><small>${new Date(s.dateISO).toLocaleString('fr-FR')}</small></div>
        <div class="r"><b>${fmt(s.total)}</b><small>${s.paymentMode}</small></div>
      </div>`).join('');

  document.getElementById('suivi-body').innerHTML = `
    <div class="chipbar" style="margin-top:14px;">${rangeBtns()}</div>
    <div class="summary3">
      <div class="box"><b>${fmt(revenue)}</b><small>Recette</small></div>
      <div class="box"><b>${fmt(expTotal)}</b><small>Dépenses</small></div>
      <div class="box"><b class="${profit>=0?'gain':'perte'}">${fmt(profit)}</b><small>Bénéfice net</small></div>
    </div>
    ${rows}
  `;
  document.querySelectorAll('[data-range]').forEach(b=>b.addEventListener('click', ()=>{ historyRange=b.dataset.range; renderVentesSub(); }));
  document.querySelectorAll('[data-sale]').forEach(row=>row.addEventListener('click', ()=>{
    showSaleDetail(state.sales.find(s=>s.id===row.dataset.sale));
  }));
}

function showSaleDetail(sale){
  if(!sale) return;
  const cogs = sale.items.reduce((a,it)=>a+it.qty*(it.coutUnitaireMoyen||0),0);
  const gain = sale.total - cogs;
  const html = `
    <div class="modal-title">Détail de la vente</div>
    <div class="receipt">
      ${sale.items.map(it=>`<div class="rline"><span>${escapeHtml(it.name)} x${it.qty}</span><span>${fmt(it.total)}</span></div>`).join('')}
      <div class="rline rtotal"><span>TOTAL</span><span>${fmt(sale.total)} ${state.config.currency}</span></div>
      <div class="rline"><span>Paiement</span><span>${sale.paymentMode}</span></div>
    </div>
    <div class="empty-note">Coût de revient estimé : ${fmt(cogs)} · Gain sur cette vente : <b class="${gain>=0?'gain':'perte'}">${fmt(gain)}</b></div>
    <div style="font-size:12px;color:var(--ink-soft);margin-top:6px;">${new Date(sale.dateISO).toLocaleString('fr-FR')}${sale.recordedBy?' · Enregistré par '+escapeHtml(sale.recordedBy):''}</div>
    <button class="btn btn-danger" style="margin-top:16px;" id="delete-sale">Annuler cette vente</button>
  `;
  openModal(html, ()=>{
    document.getElementById('delete-sale').addEventListener('click', async ()=>{
      if(!confirm('Annuler cette vente ? Le stock sera restitué.')) return;
      sale.items.forEach(it=>{
        const p = state.products.find(pp=>pp.id===it.productId);
        if(p) p.stock += it.qty;
        (it.lotConsumptions||[]).forEach(lc=>{
          if(lc.lotId){
            const lot = state.lots.find(l=>l.id===lc.lotId);
            if(lot) lot.qtyRemaining += lc.qty;
          }
        });
      });
      if(sale.creditClientId && sale.montantCredit>0){
        const client = state.creditClients.find(c=>c.id===sale.creditClientId);
        if(client) client.solde -= sale.montantCredit;
      }
      state.sales = state.sales.filter(s=>s.id!==sale.id);
      await saveState(); closeModal(); renderVentesSub(); toast('Vente annulée');
    });
  });
}

function openExpenseForm(exp){
  const isEdit = !!exp;

  const currentCat = isEdit ? (exp.categorie||'Autres') : 'Autres';
  const html = `
    <div class="modal-title">${isEdit?'Modifier la dépense':'Nouvelle dépense'}</div>
    <div class="field"><label>Libellé</label><input id="e-label" value="${isEdit?escapeHtml(exp.label):''}" placeholder="Ex: Transport, Loyer, Électricité..."></div>
    <div class="field"><label>Catégorie</label>
      <select id="e-categorie">
        ${categories.map(c=>`<option value="${c}" ${c===currentCat?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Montant</label><input id="e-amount" type="number" value="${isEdit?exp.amount:''}" placeholder="0"></div>
    <button class="btn btn-primary" id="save-expense">${isEdit?'Enregistrer':'Ajouter la dépense'}</button>
    ${isEdit?'<button class="btn btn-danger" style="margin-top:10px;" id="delete-expense">Supprimer</button>':''}
  `;
  openModal(html, ()=>{
    document.getElementById('save-expense').addEventListener('click', async ()=>{
      const label = document.getElementById('e-label').value.trim();
      const amount = Number(document.getElementById('e-amount').value)||0;
      const categorie = document.getElementById('e-categorie').value;
      if(!label || amount<=0){ toast('Renseignez le libellé et le montant'); return; }
      if(isEdit){ exp.label=label; exp.amount=amount; exp.categorie=categorie; }
      else{ state.expenses.push({id:uid(), label, amount, categorie, dateISO:new Date().toISOString(), recordedBy: currentUser()?currentUser().nom:''}); logActivity('Dépense', `${escapeHtml(label)} · ${fmt(amount)} ${state.config.currency} · ${categorie}`); }
      await saveState(); closeModal(); renderDepensesSub(); toast('Dépense enregistrée');
    });
    if(isEdit){
      document.getElementById('delete-expense').addEventListener('click', async ()=>{
        if(!confirm('Supprimer cette dépense ?')) return;
        state.expenses = state.expenses.filter(e=>e.id!==exp.id);
        await saveState(); closeModal(); renderDepensesSub(); toast('Dépense supprimée');
      });
    }
  });
}

/* ---------- DEPOTS (consignation en boutique) ---------- */
function depotStats(d){
  const attendu = d.items.reduce((a,it)=>a+(it.qty-it.qtyRendue)*it.priceUnit,0);
  const recu = d.versements.reduce((a,v)=>a+v.montant,0);
  const reste = Math.max(0, attendu-recu);
  return {attendu, recu, reste};
}

function renderDepotsSub(){
  const depots = [...state.depots].sort((a,b)=> new Date(b.dateISO)-new Date(a.dateISO));
  const totalReste = depots.reduce((a,d)=>a+depotStats(d).reste,0);
  const rows = depots.length===0 ? `<div class="empty-note" style="padding:20px 4px;">Aucun dépôt en cours. Ajoutez les articles que vous confiez à une boutique ou une alimentation.</div>` :
    depots.map(d=>{
      const st = depotStats(d);
      const solde = st.reste<=0 ? 'solde' : 'encours';
      return `<div class="row-card" data-depot="${d.id}">
        <div class="l"><b>${escapeHtml(d.lieu)}</b><small>${new Date(d.dateISO).toLocaleDateString('fr-FR')} · <span class="badge ${solde}">${st.reste<=0?'Soldé':'En cours'}</span></small></div>
        <div class="r"><b class="${st.reste<=0?'gain':''}" style="${st.reste>0?'color:var(--gold)':''}">${fmt(st.reste)}</b><small>à percevoir</small></div>
      </div>`;
    }).join('');

  document.getElementById('suivi-body').innerHTML = `
    <div class="summary3" style="margin-top:14px;">
      <div class="box"><b style="color:var(--gold)">${fmt(totalReste)}</b><small>Total à percevoir</small></div>
      <div class="box"><b>${depots.length}</b><small>Dépôts</small></div>
    </div>
    ${rows}
    <button class="fab" id="add-depot">+</button>
  `;
  document.getElementById('add-depot').addEventListener('click', ()=>openDepotForm());
  document.querySelectorAll('[data-depot]').forEach(row=>row.addEventListener('click', ()=>{
    showDepotDetail(state.depots.find(d=>d.id===row.dataset.depot));
  }));
}

function openDepotForm(){
  let lignes = [{productId:'', qty:'', priceUnit:''}];

  function ligneHtml(l,i){
    return `<div class="ligne-card" data-li="${i}">
      ${lignes.length>1 ? `<button class="rm-ligne" data-rmli="${i}">✕</button>` : ''}
      <div class="field"><label>Article</label>
        <select class="dp-product" data-idx="${i}">
          <option value="">Choisir un article</option>
          ${state.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${escapeHtml(p.name)} (${p.stock} en stock)</option>`).join('')}
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Quantité déposée</label><input class="dp-qty" data-idx="${i}" type="number" value="${l.qty}" placeholder="0"></div>
        <div class="field"><label>Prix de vente unitaire</label><input class="dp-price" data-idx="${i}" type="number" value="${l.priceUnit}" placeholder="0"></div>
      </div>
    </div>`;
  }

  function fullHtml(){
    const attendu = lignes.reduce((a,l)=>a+(Number(l.qty)||0)*(Number(l.priceUnit)||0),0);
    return `
      <div class="modal-title">Nouveau dépôt</div>
      <div class="modal-sub">Articles confiés à une boutique, une alimentation ou une personne pour vente.</div>
      <div class="field"><label>Lieu / Boutique</label><input id="dp-lieu" placeholder="Ex: Alimentation chez Fatou"></div>
      <div class="field"><label>Contact (optionnel)</label><input id="dp-contact" placeholder="Téléphone"></div>
      <div id="lignes-root">${lignes.map(ligneHtml).join('')}</div>
      <button class="add-ligne-btn" id="add-ligne">+ Ajouter un article</button>
      <div style="display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:18px;font-weight:600;padding:6px 2px 18px;">
        <span>Montant attendu</span><span>${fmt(attendu)} ${state.config.currency}</span>
      </div>
      <button class="btn btn-primary" id="save-depot">Enregistrer le dépôt</button>
    `;
  }

  function mount(){
    document.getElementById('add-ligne').addEventListener('click', ()=>{ lignes.push({productId:'', qty:'', priceUnit:''}); rerender(); });
    document.querySelectorAll('.rm-ligne').forEach(b=>b.addEventListener('click', ()=>{ lignes.splice(Number(b.dataset.rmli),1); rerender(); }));
    document.querySelectorAll('.dp-product').forEach(sel=>sel.addEventListener('change', ()=>{
      const idx = Number(sel.dataset.idx);
      lignes[idx].productId = sel.value;
      const p = state.products.find(pp=>pp.id===sel.value);
      if(p) lignes[idx].priceUnit = p.priceVente;
      rerender();
    }));
    document.querySelectorAll('.dp-qty').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].qty = inp.value; rerender(); }));
    document.querySelectorAll('.dp-price').forEach(inp=>inp.addEventListener('input', ()=>{ lignes[Number(inp.dataset.idx)].priceUnit = inp.value; rerender(); }));

    document.getElementById('save-depot').addEventListener('click', async ()=>{
      const lieu = document.getElementById('dp-lieu').value.trim();
      if(!lieu){ toast('Indiquez le lieu du dépôt'); return; }
      const items = [];
      for(const l of lignes){
        const qty = Number(l.qty)||0;
        if(!l.productId || qty<=0) continue;
        const p = state.products.find(pp=>pp.id===l.productId);
        if(!p){ continue; }
        if(p.stock < qty){ toast(`Stock insuffisant pour ${p.name}`); return; }
        items.push({productId:p.id, name:p.name, categoryId:p.categoryId, qty, qtyRendue:0, priceUnit:Number(l.priceUnit)||p.priceVente});
      }
      if(items.length===0){ toast('Ajoutez au moins un article valide'); return; }
      const contact = document.getElementById('dp-contact').value.trim();

      const proceedNew = async ()=>{
        items.forEach(it=>{
          const p = state.products.find(pp=>pp.id===it.productId);
          p.stock -= it.qty;
        });
        state.depots.push({
          id:uid(), dateISO:new Date().toISOString(), lieu, contact,
          items, versements:[], recordedBy: currentUser()?currentUser().nom:''
        });
        logActivity('Dépôt créé', `${lieu} · ${items.length} article(s)`);
        await saveState(); closeModal(); renderDepotsSub(); toast('Dépôt enregistré');
      };
      const proceedMerge = async (depot)=>{
        items.forEach(it=>{
          const p = state.products.find(pp=>pp.id===it.productId);
          p.stock -= it.qty;
          const existingItem = depot.items.find(x=>x.productId===it.productId && x.priceUnit===it.priceUnit);
          if(existingItem){ existingItem.qty += it.qty; }
          else{ depot.items.push(it); }
        });
        logActivity('Dépôt complété', `${lieu} · +${items.length} article(s)`);
        await saveState(); closeModal(); renderDepotsSub(); toast('Articles ajoutés au dépôt existant');
      };

      const existing = state.depots.find(d=>
        d.lieu.trim().toLowerCase()===lieu.toLowerCase() && depotStats(d).reste > 0
      );

      if(existing){
        openModal(`
          <div class="modal-title">Dépôt déjà en cours</div>
          <div class="modal-sub">Un dépôt chez ${escapeHtml(existing.lieu)} est déjà en cours (non soldé). Voulez-vous ajouter ces articles à ce dépôt, ou créer un dépôt séparé ?</div>
          <button class="btn btn-primary" id="merge-depot-btn">Ajouter au dépôt existant</button>
          <button class="btn btn-ghost" style="margin-top:10px;" id="new-depot-btn">Créer un nouveau dépôt séparé</button>
        `, ()=>{
          document.getElementById('merge-depot-btn').addEventListener('click', ()=>proceedMerge(existing));
          document.getElementById('new-depot-btn').addEventListener('click', proceedNew);
        });
      }else{
        await proceedNew();
      }
    });
  }

  function rerender(){ openModal(fullHtml(), mount); }
  rerender();
}

function showDepotDetail(d){
  const st = depotStats(d);
  const itemsHtml = d.items.map((it,i)=>`
    <div class="row-card" style="cursor:default;">
      <div class="l"><b>${escapeHtml(it.name)}</b><small>${it.qty} déposés · ${it.qtyRendue} retournés</small></div>

  `).join('');
  const versementsHtml = d.versements.length===0 ? '<div class="empty-note">Aucun versement reçu pour le moment.</div>' :
    d.versements.map(v=>`<div class="row-card" style="cursor:default;">
      <div class="l"><b>Versement reçu</b><small>${new Date(v.dateISO).toLocaleDateString('fr-FR')}</small></div>
      <div class="r"><b class="gain">${fmt(v.montant)}</b></div>

    </div>
    <div class="section-label">Articles déposés</div>
    ${itemsHtml}
    <div class="section-label">Versements</div>
    ${versementsHtml}
    <button class="btn btn-primary" style="margin-top:14px;" id="add-versement">Enregistrer un versement reçu</button>
    <button class="btn btn-ghost" style="margin-top:10px;" id="add-retour">Enregistrer un retour d\u2019invendus</button>
    ${d.versements.length===0 ? '<button class="btn btn-danger" style="margin-top:10px;" id="delete-depot">Supprimer ce dépôt</button>' : ''}
  `;
  openModal(html, ()=>{
    document.getElementById('add-versement').addEventListener('click', ()=>{
      openModal(`
        <div class="modal-title">Versement reçu</div>
        <div class="field"><label>Montant reçu</label><input id="v-montant" type="number" placeholder="0"></div>
        <button class="btn btn-primary" id="save-versement">Enregistrer</button>
      `, ()=>{
        document.getElementById('save-versement').addEventListener('click', async ()=>{
          const montant = Number(document.getElementById('v-montant').value)||0;
          if(montant<=0){ toast('Montant invalide'); return; }
          d.versements.push({id:uid(), dateISO:new Date().toISOString(), montant, recordedBy: currentUser()?currentUser().nom:''});
          logActivity('Versement dépôt', `${d.lieu} · ${fmt(montant)} ${state.config.currency}`);
          await saveState(); closeModal(); renderDepotsSub(); toast('Versement enregistré');
        });
      });
    });
    document.getElementById('add-retour').addEventListener('click', ()=>{
      const html2 = `
        <div class="modal-title">Retour d\u2019invendus</div>
        ${d.items.map((it,i)=>`
          <div class="field"><label>${escapeHtml(it.name)} (déposés: ${it.qty}, déjà retournés: ${it.qtyRendue})</label>
            <input class="rt-qty" data-idx="${i}" type="number" placeholder="Quantité retournée maintenant">
          </div>
        `).join('')}
        <button class="btn btn-primary" id="save-retour">Enregistrer le retour</button>
      `;
      openModal(html2, ()=>{
        document.getElementById('save-retour').addEventListener('click', async ()=>{
          let any=false;
          document.querySelectorAll('.rt-qty').forEach(inp=>{
            const idx = Number(inp.dataset.idx);
            const q = Number(inp.value)||0;
            if(q>0){
              const it = d.items[idx];
              const maxReturn = it.qty-it.qtyRendue;
              const applied = Math.min(q, maxReturn);
              if(applied>0){
                it.qtyRendue += applied;
                const p = state.products.find(pp=>pp.id===it.productId);
                if(p) p.stock += applied;
                any = true;
              }
            }
          });
          if(!any){ toast('Aucune quantité valide'); return; }
          logActivity('Retour de dépôt', d.lieu);
          await saveState(); closeModal(); renderDepotsSub(); toast('Retour enregistré');
        });
      });
    });
    const delBtn = document.getElementById('delete-depot');
    if(delBtn) delBtn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer ce dépôt et restituer le stock ?')) return;
      d.items.forEach(it=>{
        const p = state.products.find(pp=>pp.id===it.productId);
        if(p) p.stock += (it.qty-it.qtyRendue);
      });
      state.depots = state.depots.filter(x=>x.id!==d.id);
      await saveState(); closeModal(); renderDepotsSub(); toast('Dépôt supprimé');
    });
  });
}
